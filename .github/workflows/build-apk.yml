name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repoda android/ papkasi yo'q, shuning uchun uni yaratamiz.
      # lib/ va pubspec.yaml o'zgarmasligi uchun zaxiradan tiklaymiz.
      - name: Android platformasini yaratish
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.hababdu --project-name smarthome_assistant .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      # Internet, mikrofon (ovozli buyruq) va oddiy http:// (LAN server) ruxsatlari
      - name: AndroidManifest.xml ni sozlash
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          extra = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.speech.RecognitionService"/>\n'
              '        </intent>\n'
              '    </queries>\n'
              '    <application android:usesCleartextTraffic="true"'
          )
          assert "<application" in s
          s = s.replace("<application", extra, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat "$MANIFEST"

      - run: flutter pub get

      - name: APK yig'ish
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          flutter build apk --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=API_TOKEN="$API_TOKEN"

      - uses: actions/upload-artifact@v4
        with:
          name: smarthome-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
